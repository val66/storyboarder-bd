# Intégration continue — lint + tests sur une machine neuve, à chaque push et pull request.
#
# POURQUOI, alors que le hook pre-commit fait déjà tourner les deux. Le hook s'exécute sur VOTRE
# machine, avec vos paquets installés, sous Windows. Cette CI couvre exactement ce qui lui échappe :
#
#   1. UN CONTRIBUTEUR EXTERNE. C'est la raison principale, et elle est sociale plus que technique :
#      la CI dit à quelqu'un que sa contribution passe, sans qu'il ait à le demander et sans que le
#      mainteneur ait à la lancer. Les hooks git ne sont pas versionnés (cf. npm run setup-hooks) :
#      un clone frais n'en a aucun.
#
#   2. UN AUTRE SYSTÈME. Le développement se fait sous Windows, ceci tourne sous Linux. Toute
#      hypothèse de chemin qui ne marche que d'un côté devient visible. Le dépôt manipule beaucoup
#      de chemins de fichiers, y compris dans ses propres tests.
#
#   3. `npm ci` PLUTÔT QUE `npm install`. Il installe EXACTEMENT le package-lock.json et échoue si
#      celui-ci diverge de package.json. C'est le seul contrôle qui attrape une dépendance utilisée
#      mais non déclarée — le cas où « ça marche chez moi » parce que le paquet traîne dans
#      node_modules sans être dans le fichier.
#
#   4. `git commit --no-verify`, que docs/en/versioning.md recommande explicitement pour un `--amend`.
#      Le hook est alors entièrement sauté.
#
# CE QUI N'EST PAS ICI, ET POURQUOI :
#
#   — La vérification de types. Elle produit 402 diagnostics dont ZÉRO défaut réel (campagne d'août
#     2026, cf. docs/en/architecture.md règle n°5). En faire une barrière demanderait d'annoter quatre
#     cents endroits pour un rendement nul. Elle reste à la main : npm run typecheck:report.
#   — La construction de l'installeur (npm run dist). Elle demande Windows et plusieurs minutes,
#     pour vérifier une chaîne qui ne change presque jamais. À ajouter le jour où une release
#     automatique aura un sens.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : un push qui en suit un autre annule le précédent plutôt que de
# faire la queue. Sans cela, plusieurs commits rapprochés occupent les machines pour rien.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # `fail-fast: false` : si Node 20 échoue, on veut quand même savoir ce que fait Node 22.
      # L'inverse cacherait la moitié de l'information au moment précis où elle est utile.
      fail-fast: false
      matrix:
        # Les deux lignes LTS maintenues. Node 18 est en fin de vie depuis avril 2025 — les README
        # l'annonçaient encore ; ils ont été corrigés en même temps que ce fichier.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installer les dépendances (verrou strict)
        # ELECTRON_SKIP_BINARY_DOWNLOAD évite de télécharger le binaire Electron (~100 Mo) : cette
        # CI ne lance pas l'application, seulement du Node pur. `npm ci` continue de vérifier
        # l'intégrité du verrou, qui est le vrai intérêt de cette étape.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Analyse statique
        run: npm run lint

      - name: Suite de tests
        run: npm test

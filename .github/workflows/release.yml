# Publication d'une release GitHub, au push d'un tag de version.
#
# POURQUOI. `git push --follow-tags` envoie le tag, et GitHub l'affiche — sans un mot sur ce qu'il
# contient. Quelqu'un qui arrive sur la page des releases voit « v1.2.0 » et rien d'autre. Ce
# workflow y met la liste des changements, construite à partir des messages de commit.
#
# CE QUI DÉCLENCHE. Les tags `v*` uniquement. Le hook post-commit n'en pose que pour les versions
# MINEURES et MAJEURES (cf. docs/en/versioning.md) : les correctifs, eux, n'en produisent pas — trente
# releases pour trente commits n'informeraient personne.
#
# L'INSTALLEUR (#442). Depuis les mises à jour intégrées, une release doit DISTRIBUER, pas seulement
# décrire : l'application télécharge `latest.yml` puis l'installeur qu'il nomme. Le second job
# construit l'installeur sous Windows et attache les trois fichiers à la release. Quelques minutes
# par version, c'est le prix d'une mise à jour sans rien à faire à la main.
#
# ⚠️ `--publish never`, puis `gh release upload` : electron-builder sait publier lui-même, mais il
# crée par défaut un BROUILLON, invisible pour l'application, et ses règles de reprise d'une release
# existante sont subtiles. Téléverser nous-mêmes sur la release que le premier job vient de créer
# ne laisse aucune ambiguïté.

name: Release

on:
  push:
    tags:
      - 'v*'

# Le jeton par défaut est en lecture seule. Créer une release demande l'écriture sur `contents` —
# et rien de plus : on n'accorde pas ce qu'on n'utilise pas.
permissions:
  contents: write

jobs:
  publier:
    name: Publier la release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # `fetch-depth: 0` est INDISPENSABLE ici. Par défaut, actions/checkout ne récupère qu'un
          # seul commit : `git describe` ne verrait alors aucun tag antérieur, et la note publiée
          # annoncerait une première version à chaque fois. C'est le piège classique de ce workflow.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Construire la note de version
        run: node tools/release-notes.mjs "${{ github.ref_name }}" > NOTE.md

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh` est préinstallé sur les runners GitHub. `--verify-tag` refuse de publier si le tag
        # n'existe pas côté serveur : sans lui, une erreur de nom créerait un tag fantôme.
        #
        # ⚠️ IDEMPOTENT (#442b) : si la release existe déjà (tag republié après un échec de
        # l'installeur), on met sa note à jour au lieu d'échouer. Sans cela, le job installeur, qui
        # attend celui-ci, ne pourrait jamais être relancé pour une version déjà annoncée.
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --notes-file NOTE.md
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file NOTE.md --verify-tag
          fi

  installeur:
    name: Installeur Windows de ${{ github.ref_name }}
    needs: publier
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances (verrou strict)
        run: npm ci

      - name: Construire l'installeur
        run: npx electron-builder --win --publish never

      - name: Attacher l'installeur à la release
        env:
          GH_TOKEN: ${{ github.token }}
        # Les trois fichiers vont ensemble : `latest.yml` nomme l'installeur et donne son empreinte,
        # le `.blockmap` l'accompagne. `artifactName` (package.json) les nomme sans espace : GitHub
        # remplace les espaces des noms téléversés, et `latest.yml` ne nommerait plus le bon fichier.
        shell: bash
        run: gh release upload "${{ github.ref_name }}"
             dist/Storyboard-BD-Setup-*.exe
             dist/Storyboard-BD-Setup-*.exe.blockmap
             dist/latest.yml
             --clobber
